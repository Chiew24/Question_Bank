<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn with Shen — Subjects</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/dashboard.css">
<style>
/* Subjects main content only. Sidebar/header design is not restyled here. */
.dashboard-mode .sidebar .side-link,
.dashboard-mode .sidebar .side-link:hover,
.dashboard-mode .sidebar .side-link:visited,
.dashboard-mode .sidebar .side-link:active{text-decoration:none!important}
.dashboard-mode .sidebar .side-link.syllabus{font-size:15px!important;padding-left:12px!important}
.dashboard-mode .sidebar .side-link.syllabus::after{content:none!important}
.dashboard-mode .sidebar .side-link.syllabus > span{width:19px!important;text-align:center!important;font-size:18px!important}
.dashboard-mode .sidebar .side-link{box-sizing:border-box!important}
.subjects-page{min-height:100vh;padding:38px 45px 54px;display:flex;align-items:center;justify-content:center;background:transparent}
.subjects-panel{width:min(1080px,calc(100vw - 344px));height:614px;padding:40px 42px 34px;border-radius:26px;background:rgba(247,244,236,.97);border:1px solid rgba(255,255,255,.95);box-shadow:0 26px 70px rgba(22,45,67,.20);color:#24384b;display:flex;flex-direction:column}
.subjects-intro{text-align:center;margin-bottom:30px}
.subjects-intro .eyebrow{color:#55718b;font-size:12px;letter-spacing:2px;font-weight:800}
.subjects-intro h1{margin:8px 0 6px;font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1.05;letter-spacing:-1px;color:#26384a}
.subjects-intro p{margin:0;color:#657789;font-size:15px;line-height:1.5}
.subject-card{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:28px 30px;background:#fffdf8;border:1px solid #d8d3c7;border-radius:20px;box-shadow:0 14px 30px rgba(49,66,81,.10);text-decoration:none;color:#26384a;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.subject-card:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(49,66,81,.14);border-color:#6575d8}
.subject-info{min-width:0}
.subject-label{display:block;margin-bottom:9px;color:#526f8a;font-size:10px;font-weight:800;letter-spacing:1.5px}
.subject-title{margin:0 0 8px;font-size:26px;font-weight:800;color:#26384a}
.subject-description{margin:0;color:#657789;font-size:14px;line-height:1.6}
.subject-arrow{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:grid;place-items:center;background:#6575d8;color:#fff;font-size:22px;transition:transform .2s ease}
.subject-card:hover .subject-arrow{transform:translateX(4px)}
.subjects-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:17px;border-top:1px solid #ddd8cc;color:#71808d;font-size:10px;font-weight:800;letter-spacing:1.2px}
@media(max-width:1100px){.subjects-panel{width:min(960px,calc(100vw - 110px))}}
@media(max-width:720px){.subjects-page{padding:20px 15px 40px;align-items:flex-start}.subjects-panel{width:100%;height:auto;min-height:520px;padding:30px 16px 24px;border-radius:18px}.subjects-intro h1{font-size:37px}.subjects-intro p{font-size:14px}.subject-card{padding:24px 20px}.subject-title{font-size:22px}.subjects-footer{font-size:9px}}
</style>
</head>
<body class="dashboard-mode">
<div id="app">
<aside class="sidebar">
<a class="brand" href="dashboard.html"><span class="brand-symbol"><i></i><i></i><i></i></span><span><b>Learn</b> with Shen</span></a>
<div class="profile-card"><div class="avatar">◯</div><div class="profile-name">CHIEW MU SHEN</div><div class="profile-role">Student</div><button class="settings-btn" id="accountBtn">⚙</button></div>
<div class="nav-label">MENU</div>
<a class="side-link" href="dashboard.html"><span>▦</span>Overview</a>
<div class="nav-label">CURRICULUM</div>
<a class="side-link syllabus active" href="subjects.html"><span>▥</span>Subjects</a>
</aside>
<main class="main-area">
<section class="subjects-page">
<div class="subjects-panel">
<div class="subjects-intro"><div class="eyebrow">LEARN WITH SHEN</div><h1>Subjects</h1><p>Choose a subject to start learning.</p></div>
<a class="subject-card" href="dashboard.html">
<div class="subject-info"><span class="subject-label">CURRICULUM</span><h2 class="subject-title">1449 Mathematics</h2><p class="subject-description">Explore course information, lessons, practice questions and your learning history.</p></div>
<span class="subject-arrow">→</span>
</a>
<div class="subjects-footer"><span>STEP-BY-STEP LEARNING</span><span>01 SUBJECT</span></div>
</div>
</section>
</main>
</div>
<script>
const accountBtn=document.getElementById('accountBtn');
if(accountBtn) accountBtn.addEventListener('click',()=>alert('Account'));
</script>
</body>
</html>
