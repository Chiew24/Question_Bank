<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabuses</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #f7f5f0; color: #1f2937; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
    .page { width: 100%; max-width: 1000px; }
    .hero { text-align: center; margin-bottom: 48px; }
    .hero h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 700; letter-spacing: -1.5px; margin-bottom: 14px; }
    .hero p { color: #6b7280; font-size: 1.05rem; line-height: 1.6; }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
    .option { display: flex; flex-direction: column; justify-content: space-between; min-height: 260px; padding: 38px; background: #fff; border: 1px solid #e4dfd6; border-radius: 24px; text-decoration: none; color: #1f2937; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .option:hover { transform: translateY(-6px); border-color: #cfc8bc; box-shadow: 0 18px 40px rgba(31,41,55,.10); }
    .option-label { display: inline-block; margin-bottom: 18px; font-size: .75rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8a8174; }
    .option h2 { font-size: 1.8rem; margin-bottom: 12px; }
    .option p { color: #6b7280; line-height: 1.65; }
    .button-text { margin-top: 28px; font-weight: 700; display: inline-flex; align-items: center; gap: 10px; }
    .arrow { transition: transform .2s ease; }
    .option:hover .arrow { transform: translateX(5px); }
    @media (max-width: 700px) { body { align-items: flex-start; padding-top: 70px; } .options { grid-template-columns: 1fr; } .option { min-height: 220px; padding: 30px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Syllabuses</h1>
      <p>Choose how you want to access your syllabuses.</p>
    </header>
    <section class="options" aria-label="Syllabus options">
      <a class="option" href="my-syllabuses.html"><div><span class="option-label">Your Learning</span><h2>My Syllabuses</h2><p>View the syllabuses you have selected and continue learning.</p></div><span class="button-text">Open My Syllabuses <span class="arrow">→</span></span></a>
      <a class="option" href="explore-syllabuses.html"><div><span class="option-label">Discover</span><h2>Explore Syllabuses</h2><p>Browse available syllabuses and discover what you can learn.</p></div><span class="button-text">Explore Syllabuses <span class="arrow">→</span></span></a>
    </section>
  </main>
</body>
</html>
